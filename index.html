<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlantaVision AI 🌿</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.7.4/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0a0f0a;
      color: #e8f5e9;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(34,197,94,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(16,185,129,0.06) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: linear-gradient(135deg, #22c55e, #10b981);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .logo-icon { font-size: 2.5rem; filter: drop-shadow(0 0 12px #22c55e); }

    header p {
      color: #6b7280;
      margin-top: 0.5rem;
      font-size: 1rem;
      letter-spacing: 0.05em;
    }

    .card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(34,197,94,0.15);
      border-radius: 24px;
      padding: 2rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 60px rgba(34,197,94,0.05);
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      color: #6b7280;
      margin-bottom: 1.5rem;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #374151;
      transition: background 0.3s;
    }
    .dot.live { background: #22c55e; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* Upload / Drop zone */
    .upload-wrapper {
      width: 100%;
      max-width: 480px;
      margin: 0 auto 2rem;
    }

    .drop-zone {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background: #111;
      aspect-ratio: 1;
      border: 2px dashed rgba(34,197,94,0.3);
      box-shadow: 0 0 30px rgba(34,197,94,0.05);
      cursor: pointer;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: rgba(34,197,94,0.7);
      box-shadow: 0 0 40px rgba(34,197,94,0.15);
    }
    .drop-zone::before, .drop-zone::after {
      content: '';
      position: absolute;
      width: 30px; height: 30px;
      border-color: #22c55e;
      border-style: solid;
      z-index: 10;
    }
    .drop-zone::before { top: 10px; left: 10px; border-width: 3px 0 0 3px; border-radius: 4px 0 0 0; }
    .drop-zone::after  { bottom: 10px; right: 10px; border-width: 0 3px 3px 0; border-radius: 0 0 4px 0; }

    .scan-line {
      position: absolute;
      left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #22c55e, transparent);
      animation: scan 2s linear infinite;
      z-index: 5;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .scanning .scan-line { opacity: 1; }
    @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

    .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      color: #374151;
      pointer-events: none;
    }
    .placeholder-icon { font-size: 3.5rem; opacity: 0.4; }
    .placeholder p { font-size: 0.85rem; opacity: 0.5; }
    .placeholder span { font-size: 0.75rem; opacity: 0.35; }

    #preview-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    #file-input { display: none; }

    /* Buttons row */
    .btn-row {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.9rem 1.8rem;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, #22c55e, #10b981);
      color: #fff;
      box-shadow: 0 4px 20px rgba(34,197,94,0.35);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(34,197,94,0.5); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

    .btn-secondary {
      background: rgba(255,255,255,0.05);
      color: #9ca3af;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.09); color: #e5e7eb; }

    /* Results */
    .results { display: flex; flex-direction: column; gap: 1rem; }

    .result-item {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 1rem 1.2rem;
      transition: all 0.4s ease;
    }
    .result-item.active {
      border-color: rgba(34,197,94,0.4);
      background: rgba(34,197,94,0.06);
      box-shadow: 0 0 20px rgba(34,197,94,0.1);
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.6rem;
    }

    .result-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .result-emoji { font-size: 1.3rem; }

    .result-pct {
      font-size: 1.1rem;
      font-weight: 700;
      color: #22c55e;
      min-width: 50px;
      text-align: right;
    }

    .bar-track {
      height: 8px;
      background: rgba(255,255,255,0.06);
      border-radius: 99px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #22c55e, #10b981);
      width: 0%;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 8px rgba(34,197,94,0.5);
    }

    .winner-badge {
      text-align: center;
      margin-top: 1.5rem;
      padding: 1.2rem;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(34,197,94,0.1), rgba(16,185,129,0.1));
      border: 1px solid rgba(34,197,94,0.25);
      display: none;
    }
    .winner-badge.show { display: block; animation: fadeIn 0.4s ease; }
    .winner-badge .winner-emoji { font-size: 2.5rem; }
    .winner-badge .winner-text { font-size: 1.1rem; font-weight: 700; color: #22c55e; margin-top: 0.3rem; }
    .winner-badge .winner-sub { font-size: 0.8rem; color: #6b7280; margin-top: 0.2rem; }

    @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

    footer {
      text-align: center;
      margin-top: 2.5rem;
      color: #374151;
      font-size: 0.78rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <span class="logo-icon">🌿</span>
        PlantaVision AI
      </div>
      <p>Clasificador de plantas con inteligencia artificial</p>
    </header>

    <div class="card">
      <div class="status">
        <div class="dot" id="dot"></div>
        <span id="status-text">Cargando modelo...</span>
      </div>

      <div class="upload-wrapper">
        <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
          <div class="scan-line" id="scan-line"></div>
          <div class="placeholder" id="placeholder">
            <div class="placeholder-icon">🖼️</div>
            <p>Haz clic o arrastra una imagen aquí</p>
            <span>JPG · PNG · WEBP</span>
          </div>
          <img id="preview-img" alt="preview" />
        </div>
        <input type="file" id="file-input" accept="image/*" onchange="handleFile(event)" />
      </div>

      <div class="btn-row">
        <button class="btn btn-secondary" onclick="document.getElementById('file-input').click()">
          <span>📁</span> Elegir imagen
        </button>
        <button class="btn btn-primary" id="analyze-btn" disabled onclick="analyze()">
          <span>🔍</span> Analizar Planta
        </button>
      </div>

      <div class="results" id="results"></div>

      <div class="winner-badge" id="winner-badge">
        <div class="winner-emoji" id="winner-emoji"></div>
        <div class="winner-text" id="winner-text"></div>
        <div class="winner-sub">Resultado del análisis con IA</div>
      </div>
    </div>

    <footer>Modelo entrenado con Teachable Machine · TensorFlow.js · 2 clases</footer>
  </div>

  <script>
    const MODEL_URL = './';
    const LABELS_META = {
      'Planta_tomates': { emoji: '🍅', name: 'Planta de Tomates' },
      'Planta_uvas':    { emoji: '🍇', name: 'Planta de Uvas' }
    };

    let model = null;
    let imageReady = false;

    (async () => {
      try {
        model = await tmImage.load(MODEL_URL + 'model.json', MODEL_URL + 'metadata.json');
        buildResults(model.getClassLabels());
        setStatus('Modelo listo · Sube una imagen para analizar', false);
      } catch(e) {
        setStatus('Error al cargar el modelo. Usa un servidor local.', false);
        console.error(e);
      }
    })();

    // Drag & drop
    const dropZone = document.getElementById('drop-zone');
    dropZone.addEventListener('dragover', ev => { ev.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', ev => {
      ev.preventDefault();
      dropZone.classList.remove('dragover');
      const file = ev.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) loadImage(file);
    });

    function handleFile(e) {
      const file = e.target.files[0];
      if (file) loadImage(file);
    }

    function loadImage(file) {
      const reader = new FileReader();
      reader.onload = ev => {
        const img = document.getElementById('preview-img');
        img.src = ev.target.result;
        img.style.display = 'block';
        document.getElementById('placeholder').style.display = 'none';
        document.getElementById('winner-badge').classList.remove('show');
        resetBars();
        imageReady = true;
        document.getElementById('analyze-btn').disabled = !model;
        setStatus('Imagen cargada · Presiona Analizar', false);
      };
      reader.readAsDataURL(file);
    }

    async function analyze() {
      if (!model || !imageReady) return;
      const btn = document.getElementById('analyze-btn');
      btn.disabled = true;
      btn.innerHTML = '<span>⏳</span> Analizando...';
      dropZone.classList.add('scanning');
      setStatus('Analizando imagen...', true);

      const img = document.getElementById('preview-img');
      const preds = await model.predict(img);
      let best = preds[0];

      preds.forEach(p => {
        const id = p.className.replace(/\s+/g, '-');
        const pct = Math.round(p.probability * 100);
        document.getElementById('fill-' + id).style.width = pct + '%';
        document.getElementById('pct-' + id).textContent = pct + '%';
        document.getElementById('item-' + id).classList.toggle('active', p.probability > 0.5);
        if (p.probability > best.probability) best = p;
      });

      const meta = LABELS_META[best.className] || { emoji: '🌱', name: best.className };
      document.getElementById('winner-emoji').textContent = meta.emoji;
      document.getElementById('winner-text').textContent = meta.name;
      document.getElementById('winner-badge').classList.add('show');

      dropZone.classList.remove('scanning');
      setStatus('Análisis completado', false);
      btn.innerHTML = '<span>🔍</span> Analizar de nuevo';
      btn.disabled = false;
    }

    function buildResults(labels) {
      const container = document.getElementById('results');
      container.innerHTML = '';
      labels.forEach(label => {
        const id = label.replace(/\s+/g, '-');
        const meta = LABELS_META[label] || { emoji: '🌱', name: label };
        container.innerHTML += `
          <div class="result-item" id="item-${id}">
            <div class="result-header">
              <div class="result-label">
                <span class="result-emoji">${meta.emoji}</span>
                <span>${meta.name}</span>
              </div>
              <span class="result-pct" id="pct-${id}">—</span>
            </div>
            <div class="bar-track">
              <div class="bar-fill" id="fill-${id}"></div>
            </div>
          </div>`;
      });
    }

    function resetBars() {
      document.querySelectorAll('.bar-fill').forEach(b => b.style.width = '0%');
      document.querySelectorAll('.result-pct').forEach(p => p.textContent = '—');
      document.querySelectorAll('.result-item').forEach(i => i.classList.remove('active'));
    }

    function setStatus(text, live) {
      document.getElementById('status-text').textContent = text;
      document.getElementById('dot').className = 'dot' + (live ? ' live' : '');
    }
  </script>
</body>
</html>
